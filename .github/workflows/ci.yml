name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests & fact baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run offline test suite with coverage gate
        run: |
          python -m pytest -q \
            --cov=src --cov=app \
            --cov-report=term \
            --cov-fail-under=70

      - name: Audit locked dependencies
        # 两个无修复版本的上游漏洞暂列白名单：
        #   PYSEC-2026-2447  diskcache 5.6.3（无修复版本）
        #   PYSEC-2026-3046  ragas 0.4.3（无修复版本）
        # 其余漏洞一旦出现就让 CI 失败；升级后应同步删掉对应条目。
        run: |
          python -m pip_audit -r requirements.lock --strict \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-3046

      - name: Verify project fact baseline
        run: python scripts/verify_project_facts.py

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # 只构建不推送：Dockerfile 与锁文件坏掉时在合并前就能发现，
      # 不必等到打 tag 发版才暴露。gha 缓存让后续构建复用依赖层。
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  attribution-guard:
    name: Attribution guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the pushed range can be resolved.
          fetch-depth: 0

      - name: Fail if new commits credit an AI as co-author
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            RANGE="origin/${GITHUB_BASE_REF}..HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && \
               [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${GITHUB_EVENT_BEFORE}..${GITHUB_SHA}"
          else
            RANGE=""
          fi

          # Fall back to the tip commit when the range cannot be resolved
          # (new branch, first push, or a base ref that does not exist locally).
          if [ -z "${RANGE}" ] || ! git rev-list "${RANGE}" >/dev/null 2>&1; then
            echo "Commit range unresolved; scanning the tip commit only."
            RANGE="-1"
          fi

          echo "Scanning commit range: ${RANGE}"
          git log ${RANGE} --format='%H%n%B%n---'

          if git log ${RANGE} --format='%B' \
             | grep -inE '^co-authored-by:.*(claude|anthropic|copilot|openai)'; then
            echo "::error::An AI co-author trailer was found in a commit message."
            echo "::error::Commit messages must not credit an AI as a co-author of this repository."
            exit 1
          fi

          echo "OK: no AI co-author trailers found."
