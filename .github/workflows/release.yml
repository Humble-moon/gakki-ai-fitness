name: Release

on:
  # 只由 tag 触发：手动触发时没有版本号，镜像 tag 与扫描目标都会落空，
  # 重发应该走 "Re-run jobs" 或重新打一个更高版本的 tag。
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 版本号直接决定镜像 tag：允许 v1 这类松散标签，回滚时就无法比较大小。
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须是 vMAJOR.MINOR.PATCH，当前为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      # GHCR 的镜像名必须全小写，而 github.repository 会保留账号大小写。
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            镜像：`${{ env.IMAGE }}:${{ github.ref_name }}`

            回滚方式见 `docs/release.md`：重新部署上一个 tag 的镜像即可；
            数据库迁移不回滚，因此回滚前需确认上一版本仍兼容当前 schema。
